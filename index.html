<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nairobi Style Finder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3d63">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #eceff2; --surface: #ffffff; --ink: #14202e; --muted: #566475; --line: #d3d9e0;
  --brand: #1d3d63; --brand-ink: #f3f6fa; --sign: #f2b705; --sign-ink: #14202e;
  --good: #1b7a4b; --bad: #b3322b; --focus: #1d5fd0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e151e; --surface: #16202c; --ink: #e7ecf2; --muted: #93a2b4; --line: #263445;
    --brand: #13233a; --brand-ink: #eaf0f7; --good: #5fcb93; --bad: #f08a82; --focus: #7fb0ff; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
header { background: var(--brand); color: var(--brand-ink); padding: 18px 0 0; }
header h1 { font-size: 28px; letter-spacing: .01em; }
header p { opacity: .9; max-width: 48ch; margin-top: 4px; }
nav { display: flex; gap: 4px; margin-top: 14px; }
nav button { border: 0; background: transparent; color: var(--brand-ink); padding: 10px 16px; min-height: 44px; cursor: pointer; border-bottom: 4px solid transparent; font-weight: 600; }
nav button[aria-current="page"] { border-bottom-color: var(--sign); }
main { padding: 18px 0 48px; display: flex; flex-direction: column; gap: 16px; }
.btn { min-height: 44px; padding: 8px 18px; border: 2px solid var(--ink); background: var(--surface); border-radius: 4px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign-ink); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; border-width: 1px; border-color: var(--line); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
input, select { width: 100%; min-height: 44px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.muted { color: var(--muted); font-size: 14px; }
.error { color: var(--bad); font-weight: 600; }
.ok { color: var(--good); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-width: 0; }
.card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px 4px 0 0; background: var(--line); display: block; }
.card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.price { font-size: 22px; font-weight: 700; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; background: var(--sign); color: var(--sign-ink); border-radius: 2px; }
.wa { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 4px; background: var(--good); color: var(--bg); text-decoration: none; font-weight: 700; }
.preview { max-width: 160px; border-radius: 4px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Nairobi Style Finder</h1>
    <p>Photograph a shoe or outfit you like and see which Nairobi shops stock something close.</p>
    <p><button id="install-btn" class="btn small" type="button" hidden>Install this app on your phone</button></p>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script type="module">
// ---------- 1. Settings: edit these three things ----------
const SUPABASE_URL = 'https://kgwaxbjxfbzpcpbrwbtx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FhKmtn0yh0WDsKxBhKDZLw_cIBX847H';   // the "anon public" key is safe to put in a web page
const AREAS = ['Eastleigh', 'CBD', 'Gikomba', 'Westlands', 'Kayole', 'Other'];

const CATEGORIES = ['shoes', 'tops', 'trousers', 'dresses', 'jackets', 'bags', 'other'];
const CONDITIONS = ['new', 'mitumba', 'ex-uk'];
const REASONS = ['Already sold', 'Fake or stolen photo', 'Wrong price', 'Scam or suspicious', 'Other'];
const MIN_SIMILARITY = 0.65;        // lower shows more (looser) matches, higher shows fewer
const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';
const CLIP_MODEL = 'Xenova/clip-vit-base-patch32';

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- 2. Small helpers ----------
const app = document.getElementById('app');
const state = { session: null, shop: null, isAdmin: false, tab: 'find', lastVec: null };

const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...kids.flat().filter(x => x != null && x !== false));
  return el;
};
const field = (labelText, control) => h('div', {}, h('label', { for: control.id }, labelText), control);
const select = (id, options, blank) => h('select', { id }, blank ? h('option', { value: '' }, blank) : null, options.map(o => h('option', { value: o }, o)));
const kes = n => 'KES ' + Number(n).toLocaleString('en-KE');
const daysAgo = ts => Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 864e5));
const publicUrl = path => sb.storage.from('item-photos').getPublicUrl(path).data.publicUrl;
const vecText = v => JSON.stringify(v);          // pgvector accepts '[0.1,0.2,...]'
function normPhone(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.startsWith('0')) d = '254' + d.slice(1);
  else if (d.length === 9) d = '254' + d;
  return /^254[17]\d{8}$/.test(d) ? d : null;
}
const messageBox = () => h('p', { class: 'muted', role: 'status', 'aria-live': 'polite' });
const say = (box, text, kind) => { box.textContent = text; box.className = kind || 'muted'; };

async function compress(file, max = 1000, quality = 0.8) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * s));
  c.height = Math.max(1, Math.round(bmp.height * s));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', quality));
}

// ---------- 3. Photo fingerprint (runs in the browser, nothing to host) ----------
let clipPromise = null;
function loadClip() {
  if (!clipPromise) {
    clipPromise = (async () => {
      const T = await import(TRANSFORMERS_URL);
      const [processor, model] = await Promise.all([
        T.AutoProcessor.from_pretrained(CLIP_MODEL),
        T.CLIPVisionModelWithProjection.from_pretrained(CLIP_MODEL),
      ]);
      return { T, processor, model };
    })();
    clipPromise.catch(() => { clipPromise = null; });
  }
  return clipPromise;
}
async function embed(blob) {
  const { T, processor, model } = await loadClip();
  const image = await T.RawImage.fromBlob(blob);
  const { image_embeds } = await model(await processor(image));
  const v = Array.from(image_embeds.data);
  let n = 0; for (const x of v) n += x * x; n = Math.sqrt(n) || 1;
  return v.map(x => x / n);
}

// ---------- 4. Session ----------
async function refreshUser() {
  state.shop = null; state.isAdmin = false;
  if (state.session) {
    const [shopRes, adminRes] = await Promise.all([
      sb.from('shops').select('*').eq('owner_id', state.session.user.id).maybeSingle(),
      sb.rpc('is_admin'),
    ]);
    state.shop = shopRes.data || null;
    state.isAdmin = adminRes.data === true;
  }
  renderNav();
  if (state.tab === 'admin' && !state.isAdmin) state.tab = 'find';
  if (state.tab !== 'find') render();
}
sb.auth.onAuthStateChange((_event, session) => { state.session = session; refreshUser(); });
sb.auth.getSession().then(({ data }) => { state.session = data.session; refreshUser(); });

function renderNav() {
  const tabs = [['find', 'Find'], ['sell', 'Sell']];
  if (state.isAdmin) tabs.push(['admin', 'Admin']);
  const nav = document.getElementById('nav');
  nav.replaceChildren(...tabs.map(([id, label]) =>
    h('button', { type: 'button', 'aria-current': state.tab === id ? 'page' : null, onclick: () => { state.tab = id; renderNav(); render(); } }, label)));
}
function render() {
  app.replaceChildren();
  if (state.tab === 'find') return viewFind();
  if (state.tab === 'sell') return viewSell();
  if (state.tab === 'admin') return viewAdmin();
}

// ---------- 5. Buyer: find by photo ----------
function viewFind() {
  const status = messageBox();
  const results = h('div', { class: 'grid' });
  const preview = h('img', { class: 'preview', alt: 'Your photo', hidden: true });
  const camera = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true });
  const gallery = h('input', { type: 'file', accept: 'image/*', hidden: true });
  const area = select('f-area', AREAS, 'Any area');
  const cat = select('f-cat', CATEGORIES, 'Any type');
  const price = h('input', { id: 'f-price', type: 'text', inputmode: 'numeric', placeholder: 'No limit' });

  async function search() {
    if (!state.lastVec) return;
    say(status, 'Searching...');
    const { data, error } = await sb.rpc('match_items', {
      query_embedding: vecText(state.lastVec),
      match_count: 24,
      filter_area: area.value || null,
      filter_category: cat.value || null,
      max_price: parseInt(price.value.replace(/\D/g, ''), 10) || null,
    });
    results.replaceChildren();
    if (error) return say(status, 'Search failed: ' + (error.message || '') + ' ' + (error.details || '') + ' ' + (error.hint || '') + ' [' + (error.code || '') + ']', 'error');
    const close = (data || []).filter(r => r.similarity >= MIN_SIMILARITY);
    sb.from('events').insert({ kind: 'search' }).then(() => {});
    if (!close.length) return say(status, 'No close match yet. Try a clearer photo, a different angle or remove a filter. New items are added every week.');
    say(status, close.length + (close.length === 1 ? ' similar item' : ' similar items') + '. These are close matches, not always the exact item.');
    close.forEach(r => results.append(card(r)));
  }

  async function onPhoto(file) {
    if (!file) return;
    preview.hidden = false; preview.src = URL.createObjectURL(file);
    results.replaceChildren();
    try {
      say(status, clipPromise ? 'Reading your photo...' : 'Loading the photo matcher. The first time takes a minute on mobile data (about 90 MB), then it is saved on your phone.');
      state.lastVec = await embed(await compress(file, 640));
      await search();
    } catch (e) {
      console.error(e);
      say(status, 'Could not read that photo. Try another one.', 'error');
    }
  }
  camera.addEventListener('change', () => onPhoto(camera.files[0]));
  gallery.addEventListener('change', () => onPhoto(gallery.files[0]));
  [area, cat].forEach(el => el.addEventListener('change', search));
  price.addEventListener('change', search);

  app.append(
    h('div', { class: 'panel' },
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', type: 'button', onclick: () => camera.click() }, 'Take a photo'),
        h('button', { class: 'btn', type: 'button', onclick: () => gallery.click() }, 'Choose a photo'),
        preview),
      camera, gallery,
      h('div', { class: 'row' }, field('Area', area), field('Type', cat), field('Highest price (KES)', price)),
      status),
    results);
}

function card(r) {
  const reportRow = h('div', { class: 'reasons', hidden: true });
  const reportMsg = messageBox();
  REASONS.forEach(reason => reportRow.append(h('button', { class: 'btn small', type: 'button', onclick: async () => {
    const { error } = await sb.from('reports').insert({ item_id: r.item_id, reason });
    reportRow.hidden = true;
    say(reportMsg, error ? 'Report did not send. Try again.' : 'Report sent. Thank you.', error ? 'error' : 'ok');
  } }, reason)));
  const days = daysAgo(r.last_confirmed_at);
  const wa = normPhone(r.whatsapp);
  const msg = 'Hello, I saw ' + (r.title || 'an item') + ' (' + kes(r.price_kes) + ') on Nairobi Style Finder. Is it still available?';
  return h('article', { class: 'card' },
    h('img', { src: publicUrl(r.photo_path), alt: r.title || r.category, loading: 'lazy' }),
    h('div', { class: 'body' },
      h('p', { class: 'price' }, kes(r.price_kes)),
      h('p', {}, r.title || r.category),
      h('p', { class: 'muted' }, [r.size, r.condition].filter(Boolean).join(' · ')),
      h('p', {}, r.shop_name, ' ', r.verified ? h('span', { class: 'tag' }, 'Verified') : null),
      h('p', { class: 'muted' }, [r.area, r.building, r.floor].filter(Boolean).join(', ')),
      h('p', { class: 'muted' }, days === 0 ? 'Confirmed today' : 'Confirmed ' + days + ' days ago'),
      wa ? h('a', { class: 'wa', href: 'https://wa.me/' + wa + '?text=' + encodeURIComponent(msg), target: '_blank', rel: 'noopener noreferrer',
        onclick: () => sb.from('events').insert({ kind: 'whatsapp_click', item_id: r.item_id }).then(() => {}) }, 'WhatsApp the shop') : null,
      h('button', { class: 'btn small', type: 'button', onclick: () => { reportRow.hidden = !reportRow.hidden; } }, 'Report'),
      reportRow, reportMsg));
}

// ---------- 6. Seller ----------
function viewSell() {
  if (!state.session) return sellSignIn();
  if (!state.shop) return sellCreateShop();
  if (!state.shop.approved) {
    return app.append(h('div', { class: 'panel' },
      h('h2', {}, state.shop.name),
      h('p', {}, 'Your shop is waiting for approval. You can add items as soon as it is approved.'),
      signOutButton()));
  }
  return sellDashboard();
}
const signOutButton = () => h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.auth.signOut(); } }, 'Sign out');

function sellSignIn() {
  const email = h('input', { id: 's-email', type: 'email', autocomplete: 'email', placeholder: 'you@example.com' });
  const msg = messageBox();
  const btn = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    if (!email.value.includes('@')) return say(msg, 'Enter a valid email address.', 'error');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email: email.value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
    btn.disabled = false;
    say(msg, error ? 'Could not send the link. Check the email address.' : 'Check your email and open the link on this phone.', error ? 'error' : 'ok');
  } }, 'Send sign-in link');
  app.append(h('div', { class: 'panel' },
    h('h2', {}, 'Sell on Nairobi Style Finder'),
    h('p', { class: 'muted' }, 'List your stock free. Buyers who want the same kind of item contact you on WhatsApp.'),
    field('Your email', email), btn, msg));
}

function sellCreateShop() {
  const name = h('input', { id: 'sh-name', type: 'text', maxlength: 80 });
  const area = select('sh-area', AREAS);
  const building = h('input', { id: 'sh-building', type: 'text', placeholder: 'Mall or building and street' });
  const floor = h('input', { id: 'sh-floor', type: 'text', placeholder: 'e.g. Ground floor, shop 12' });
  const wa = h('input', { id: 'sh-wa', type: 'text', inputmode: 'tel', placeholder: '0712 345 678' });
  const msg = messageBox();
  const btn = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    const phone = normPhone(wa.value);
    if (name.value.trim().length < 2) return say(msg, 'Enter your shop name.', 'error');
    if (!phone) return say(msg, 'Enter a Kenyan mobile number, like 0712 345 678.', 'error');
    btn.disabled = true;
    const { error } = await sb.from('shops').insert({ owner_id: state.session.user.id, name: name.value.trim(), area: area.value,
      building: building.value.trim() || null, floor: floor.value.trim() || null, whatsapp: phone });
    btn.disabled = false;
    if (error) return say(msg, 'Could not save your shop. Try again.', 'error');
    await refreshUser(); render();
  } }, 'Submit shop for approval');
  app.append(h('div', { class: 'panel' },
    h('h2', {}, 'Tell us about your shop'),
    field('Shop name', name),
    h('div', { class: 'row' }, field('Area', area), field('WhatsApp number', wa)),
    h('div', { class: 'row' }, field('Building and street', building), field('Floor and shop number', floor)),
    h('p', { class: 'muted' }, 'We check every shop before it appears. Buyers see your name, location and WhatsApp number.'),
    btn, msg, signOutButton()));
}

async function sellDashboard() {
  const mine = h('div', { class: 'grid' });
  const files = h('input', { id: 'it-photos', type: 'file', accept: 'image/*', multiple: true });
  const cat = select('it-cat', CATEGORIES);
  const cond = select('it-cond', CONDITIONS);
  const size = h('input', { id: 'it-size', type: 'text', maxlength: 20, placeholder: 'e.g. 42, M, XL' });
  const price = h('input', { id: 'it-price', type: 'text', inputmode: 'numeric' });
  const title = h('input', { id: 'it-title', type: 'text', maxlength: 80, placeholder: 'e.g. Black leather sneakers' });
  const msg = messageBox();
  const btn = h('button', { class: 'btn primary', type: 'button', onclick: addItem }, 'Add item');

  async function addItem() {
    const picked = Array.from(files.files).slice(0, 3);
    const amount = parseInt(price.value.replace(/\D/g, ''), 10);
    if (!picked.length) return say(msg, 'Add at least one photo of the real item.', 'error');
    if (!Number.isFinite(amount)) return say(msg, 'Enter the price in KES.', 'error');
    btn.disabled = true;
    let itemId = null;
    let stage = 'reading the photo';
    try {
      say(msg, 'Preparing photos. The first time loads the photo matcher (about 90 MB).');
      const prepared = [];
      for (const f of picked) { const blob = await compress(f); prepared.push({ blob, vec: await embed(blob) }); }
      stage = 'saving the item';
      const { data: item, error } = await sb.from('items').insert({ shop_id: state.shop.id, category: cat.value, title: title.value.trim() || null,
        size: size.value.trim() || null, condition: cond.value, price_kes: amount }).select().single();
      if (error) throw error;
      itemId = item.id;
      for (let i = 0; i < prepared.length; i++) {
        const path = state.session.user.id + '/' + itemId + '/' + (i + 1) + '.jpg';
        stage = 'uploading the picture';
        const up = await sb.storage.from('item-photos').upload(path, prepared[i].blob, { contentType: 'image/jpeg', upsert: false });
        if (up.error) throw up.error;
        stage = 'saving the photo fingerprint';
        const ins = await sb.from('item_photos').insert({ item_id: itemId, path, embedding: vecText(prepared[i].vec) });
        if (ins.error) throw ins.error;
      }
      files.value = ''; title.value = ''; size.value = ''; price.value = '';
      say(msg, 'Item added. Buyers can find it now.', 'ok');
      await loadMine();
    } catch (e) {
      console.error(e);
      if (itemId) await sb.from('items').delete().eq('id', itemId);
      say(msg, 'Could not add the item while ' + stage + ': ' + ((e && (e.message || e.error_description)) || String(e)), 'error');
    }
    btn.disabled = false;
  }

  async function loadMine() {
    const { data } = await sb.from('items').select('*, item_photos(path)').eq('shop_id', state.shop.id).order('created_at', { ascending: false });
    mine.replaceChildren();
    if (!data || !data.length) return mine.append(h('p', { class: 'muted' }, 'No items yet. Add your first item above.'));
    data.forEach(it => {
      const days = daysAgo(it.last_confirmed_at);
      const expired = days > 30;
      mine.append(h('article', { class: 'card' },
        it.item_photos[0] ? h('img', { src: publicUrl(it.item_photos[0].path), alt: it.title || it.category, loading: 'lazy' }) : null,
        h('div', { class: 'body' },
          h('p', { class: 'price' }, kes(it.price_kes)),
          h('p', {}, it.title || it.category),
          h('p', { class: expired || it.status !== 'live' ? 'error' : 'muted' },
            it.status === 'sold' ? 'Sold' : expired ? 'Hidden from buyers: confirm it is still available' : 'Live, confirmed ' + (days === 0 ? 'today' : days + ' days ago')),
          h('div', { class: 'actions' },
            h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('items').update({ status: 'live', last_confirmed_at: new Date().toISOString() }).eq('id', it.id); loadMine(); } }, 'Still available'),
            h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('items').update({ status: 'sold' }).eq('id', it.id); loadMine(); } }, 'Sold'),
            h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('items').delete().eq('id', it.id); loadMine(); } }, 'Delete')))));
    });
  }

  app.append(
    h('div', { class: 'panel' },
      h('h2', {}, state.shop.name), signOutButton()),
    h('div', { class: 'panel' },
      h('h2', {}, 'Add an item'),
      field('Photos of the real item (up to 3)', files),
      h('div', { class: 'row' }, field('Type', cat), field('Condition', cond), field('Size', size), field('Price (KES)', price)),
      field('Short name (optional)', title),
      btn, msg),
    h('h2', {}, 'Your items'),
    mine);
  loadMine();
}

// ---------- 7. Admin ----------
async function viewAdmin() {
  const box = h('div', { class: 'panel' }, h('p', { class: 'muted' }, 'Loading...'));
  app.append(box);
  const count = async (kind) => (await sb.from('events').select('*', { count: 'exact', head: true }).eq('kind', kind)).count || 0;
  const [searches, taps, shopsRes, reportsRes] = await Promise.all([
    count('search'), count('whatsapp_click'),
    sb.from('shops').select('*').order('approved').order('created_at', { ascending: false }),
    sb.from('reports').select('id, reason, item_id, items(title, category, price_kes, shops(name, whatsapp))').eq('handled', false).order('created_at', { ascending: false }),
  ]);
  const setShop = async (id, approved, verified) => { await sb.rpc('admin_set_shop', { p_shop: id, p_approved: approved, p_verified: verified }); viewAdminRefresh(); };
  const viewAdminRefresh = () => { app.replaceChildren(); viewAdmin(); };

  box.replaceChildren(
    h('h2', {}, 'Numbers'),
    h('p', {}, searches + ' searches, ' + taps + ' WhatsApp taps'),
    h('h2', {}, 'Shops'),
    ...(shopsRes.data || []).map(s => h('div', { class: 'panel' },
      h('p', {}, h('strong', {}, s.name), ' · ' + s.area + ' · ' + s.whatsapp),
      h('p', { class: 'muted' }, [s.building, s.floor].filter(Boolean).join(', ') + (s.approved ? ' · approved' : ' · waiting for approval') + (s.verified ? ' · verified' : '')),
      h('div', { class: 'actions' },
        !s.approved ? h('button', { class: 'btn small', type: 'button', onclick: () => setShop(s.id, true, s.verified) }, 'Approve') : h('button', { class: 'btn small', type: 'button', onclick: () => setShop(s.id, false, false) }, 'Unapprove'),
        h('button', { class: 'btn small', type: 'button', onclick: () => setShop(s.id, s.approved || true, !s.verified) }, s.verified ? 'Remove verified' : 'Approve and mark verified'),
        h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('shops').delete().eq('id', s.id); viewAdminRefresh(); } }, 'Delete shop')))),
    h('h2', {}, 'Open reports'),
    ...((reportsRes.data || []).length ? reportsRes.data.map(r => h('div', { class: 'panel' },
      h('p', {}, h('strong', {}, r.reason), ': ' + ((r.items && (r.items.title || r.items.category)) || 'item') + (r.items ? ' · ' + kes(r.items.price_kes) : '')),
      h('p', { class: 'muted' }, r.items && r.items.shops ? r.items.shops.name + ' · ' + r.items.shops.whatsapp : ''),
      h('div', { class: 'actions' },
        h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('items').delete().eq('id', r.item_id); viewAdminRefresh(); } }, 'Remove item'),
        h('button', { class: 'btn small', type: 'button', onclick: async () => { await sb.from('reports').update({ handled: true }).eq('id', r.id); viewAdminRefresh(); } }, 'Dismiss')))) : [h('p', { class: 'muted' }, 'No open reports.')]));
}

renderNav();
render();

// ---------- Install as an app ----------
let installEvent = null;
const installBtn = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvent = e; installBtn.hidden = false;
});
installBtn.addEventListener('click', async () => {
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch (e) {}
  installEvent = null; installBtn.hidden = true;
});
window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
